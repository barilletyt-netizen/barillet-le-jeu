<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E140F" />
    <meta
      name="description"
      content="Barillet — le jeu : bâtissez une marque horlogère de 2015 à 2035 et visez le Top 50 mondial."
    />
    <title>Barillet — le jeu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e140f;
      }
      input:focus,
      button:focus {
        outline: 2px solid #c9a227;
      }
      /* Pas de flèches sur les champs numériques : le pouce sur mobile suffit. */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
      /* Décompte d'heures : le chiffre doit réagir au moment de l'action. */
      @keyframes barillet-pulse {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes barillet-monte {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
